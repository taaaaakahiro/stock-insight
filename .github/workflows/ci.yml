name: ci

# プルリクエストと main への push で品質チェックだけを行う。シークレットは使わない（pull_request_target は使わない）
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ci-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      # rust-toolchain.toml のバージョンと wasm32 ターゲットが自動で入る
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: clippy (wasm32 / Worker)
        run: cargo clippy -p api-worker -p adapter-cf --target wasm32-unknown-unknown -- -D warnings

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # 本番ビルドは Clerk の公開キーがないと失敗する（画面が消えた空のバンドルを防ぐため）。公開キーは Variables に置く
      - run: pnpm build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
