name: ci

# プルリクエストと main への push で品質チェックだけを行う。シークレットは使わない（pull_request_target は使わない）
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # 全履歴にキー・トークンが入っていないかを gitleaks で調べる。値はログに出さない（--redact）
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks を入れる（チェックサムを確かめる）
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - run: ./gitleaks git --redact --no-banner -v .

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: ci-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      # rust-toolchain.toml のバージョンと wasm32 ターゲットが自動で入る
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: python3 scripts/test_recommendation_tracking.py
      - run: python3 scripts/test_reit_rag.py
      - run: python3 scripts/test_diagnose_cloudflare.py
      - run: python3 scripts/test_reit_workflow_gate.py
      - name: clippy (wasm32 / Worker)
        run: cargo clippy -p api-worker -p adapter-cf --target wasm32-unknown-unknown -- -D warnings

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.14.4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # 本番ビルドは Clerk の公開キーがないと失敗する（画面が消えた空のバンドルを防ぐため）。公開キーは Variables に置く
      - run: pnpm build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
