name: production-login-monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/login-monitor.yml
      - scripts/login-monitor/**

permissions:
  contents: read

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scripts/login-monitor
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: scripts/login-monitor/package-lock.json
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: node check.mjs

