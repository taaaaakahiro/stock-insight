name: daily-batch

# 日次バッチ: 銘柄マスタ（JPX）を更新し、J-Quants から株価（終値）と財務（本決算）を取り込んで、指標を D1 に保存する。
# あわせて EDINET から有報・半期報告書（銘柄ごとに最新の1通）の配当政策などの文章を取り、配当方針の手がかりを D1 に、文章を R2 に置く。
# 初回だけ過去5年分をまとめて取り込み、2回目以降は前回の続き（毎日なら当日分）だけを取る。
# 起動は Cloudflare の Cron Trigger（平日 18:30 JST）からの workflow_dispatch。schedule は予備で、
# 同じ日に2回動いても should-run が2回目を止める（休場日も止める）。
# シークレットは gh secret set で登録する（値はここに書かない。docs/06_secrets_and_repository.md）。
on:
  workflow_dispatch:
    inputs:
      force:
        description: "true なら休場日・当日実行済みでも動かす"
        default: "false"
      probe:
        description: "true なら D1 に触れず、直近の数日分を J-Quants から取って SQL を成果物に保存する（取得元の確認用）"
        default: "false"
      max_minutes:
        description: "取り込みの時間の上限（分）。過ぎたらそこまでを保存し、次回は続きから"
        default: "300"
  schedule:
    # 予備（09:45 UTC = 18:45 JST、平日）。Cloudflare 側で起動済みなら should-run が止める
    - cron: "45 9 * * 1-5"

permissions:
  contents: read

concurrency:
  group: daily-batch
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
  EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}

jobs:
  # 一度だけビルドして、後のジョブはバイナリを使い回す
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: batch-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo build -q -p batch-cli --release
      - uses: actions/upload-artifact@v4
        with:
          name: batch-cli
          path: target/release/batch-cli
          retention-days: 1

  # 取得元の確認（D1 には触れない）
  probe:
    needs: build
    if: github.event.inputs.probe == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: batch-cli
      - run: chmod +x batch-cli
      - run: |
          ./batch-cli sync-jq --dry-run probe.sql \
            --from "$(date -u -d '8 days ago' +%F)" --until "$(date -u -d '1 day ago' +%F)"
        env:
          CLOUDFLARE_ACCOUNT_ID: ""
          D1_DATABASE_ID: ""
          CLOUDFLARE_API_TOKEN: ""
      # EDINET は API キーがあるときだけ確認する
      - run: |
          [ -z "$EDINET_API_KEY" ] && { echo "EDINET_API_KEY is not set; skip"; exit 0; }
          ./batch-cli sync-edinet --dry-run probe-edinet.sql --limit 5 \
            --from "$(date -u -d '8 days ago' +%F)" --until "$(date -u -d '1 day ago' +%F)"
        env:
          CLOUDFLARE_ACCOUNT_ID: ""
          D1_DATABASE_ID: ""
          CLOUDFLARE_API_TOKEN: ""
      - uses: actions/upload-artifact@v4
        with:
          name: probe-sql
          path: |
            probe*.sql
            raw/
          retention-days: 3

  guard:
    needs: build
    if: github.event.inputs.probe != 'true'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: batch-cli
      - run: chmod +x batch-cli
      - id: check
        run: ./batch-cli should-run --label daily ${{ github.event.inputs.force == 'true' && '--force' || '' }}

  daily:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 初回の5年分は約1時間。途中で止まっても次回は続きから
    timeout-minutes: 340
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: batch-cli
      - run: chmod +x batch-cli
      - run: ./batch-cli migrate
      - run: ./batch-cli sync-master
      - run: ./batch-cli sync-jq --rate 60 --max-minutes "${{ github.event.inputs.max_minutes || '300' }}" --raw-dir raw
      - run: ./batch-cli compute --label daily
      # EDINET の有報・半期報告書（銘柄・種類ごとに最新の1通）。初回は過去400日分の一覧から（約1時間強。時間切れなら次回は続きから）。
      # 指標の計算より後に置き、ここが失敗しても一覧の更新は止めない
      - name: sync EDINET
        continue-on-error: true
        run: ./batch-cli sync-edinet --rate 60 --max-minutes 60 --raw-dir raw
      # J-Quants の応答（全項目）を日付ごとの gzip JSON で、EDINET の文章を銘柄・種類ごとの gzip JSON で R2 に置く。
      # EDINET は同じキーに上書きするので古い書類は残らない。新しい有報で古くなった半期報告書と上場廃止の銘柄は消す。
      # ここが失敗しても一覧の更新は止めない（CLOUDFLARE_API_TOKEN に R2 の編集権限が要る）
      - name: upload raw data to R2
        run: |
          shopt -s nullglob globstar
          jq_files=(raw/bars/*.json.gz raw/fins/*.json.gz)
          ed_files=(raw/edinet/**/*.json.gz)
          deletes=()
          [ -f raw/edinet-delete.txt ] && mapfile -t deletes < raw/edinet-delete.txt
          echo "${#jq_files[@]} J-Quants files, ${#ed_files[@]} EDINET files to upload, ${#deletes[@]} to delete"
          [ $(( ${#jq_files[@]} + ${#ed_files[@]} + ${#deletes[@]} )) -eq 0 ] && exit 0
          npm install -g --silent wrangler@4.151.3
          for f in "${jq_files[@]}"; do
            wrangler r2 object put "maaun-stock-insight-raw/jquants/${f#raw/}" --file "$f" --remote >/dev/null
          done
          for f in "${ed_files[@]}"; do
            wrangler r2 object put "maaun-stock-insight-raw/${f#raw/}" --file "$f" --remote >/dev/null
          done
          for k in "${deletes[@]}"; do
            wrangler r2 object delete "maaun-stock-insight-raw/$k" --remote >/dev/null || echo "not found: $k"
          done
          echo "done"
