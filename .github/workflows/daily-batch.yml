name: daily-batch

# 日次バッチ: 銘柄マスタ（JPX）を更新し、J-Quants から株価（終値）と財務（本決算）を取り込んで、指標を D1 に保存する。
# 初回だけ過去5年分をまとめて取り込み、2回目以降は前回の続き（毎日なら当日分）だけを取る。
# 起動は Cloudflare の Cron Trigger（平日 18:30 JST）からの workflow_dispatch。schedule は予備で、
# 同じ日に2回動いても should-run が2回目を止める（休場日も止める）。
# シークレットは gh secret set で登録する（値はここに書かない。docs/06_secrets_and_repository.md）。
on:
  workflow_dispatch:
    inputs:
      force:
        description: "true なら休場日・当日実行済みでも動かす"
        default: "false"
      probe:
        description: "true なら D1 に触れず、直近の数日分を J-Quants から取って SQL を成果物に保存する（取得元の確認用）"
        default: "false"
      max_minutes:
        description: "取り込みの時間の上限（分）。過ぎたらそこまでを保存し、次回は続きから"
        default: "300"
  schedule:
    # 予備（09:45 UTC = 18:45 JST、平日）。Cloudflare 側で起動済みなら should-run が止める
    - cron: "45 9 * * 1-5"

permissions:
  contents: read

concurrency:
  group: daily-batch
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}

jobs:
  # 一度だけビルドして、後のジョブはバイナリを使い回す
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: batch-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo build -q -p batch-cli --release
      - uses: actions/upload-artifact@v4
        with:
          name: batch-cli
          path: target/release/batch-cli
          retention-days: 1

  # 取得元の確認（D1 には触れない）
  probe:
    needs: build
    if: github.event.inputs.probe == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: batch-cli
      - run: chmod +x batch-cli
      - run: |
          ./batch-cli sync-jq --dry-run probe.sql \
            --from "$(date -u -d '8 days ago' +%F)" --until "$(date -u -d '1 day ago' +%F)"
        env:
          CLOUDFLARE_ACCOUNT_ID: ""
          D1_DATABASE_ID: ""
          CLOUDFLARE_API_TOKEN: ""
      - uses: actions/upload-artifact@v4
        with:
          name: probe-sql
          path: |
            probe.sql
            raw/
          retention-days: 3

  guard:
    needs: build
    if: github.event.inputs.probe != 'true'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: batch-cli
      - run: chmod +x batch-cli
      - id: check
        run: ./batch-cli should-run --label daily ${{ github.event.inputs.force == 'true' && '--force' || '' }}

  daily:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 初回の5年分は約1時間。途中で止まっても次回は続きから
    timeout-minutes: 340
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: batch-cli
      - run: chmod +x batch-cli
      - run: ./batch-cli migrate
      - run: ./batch-cli sync-master
      - run: ./batch-cli sync-jq --rate 60 --max-minutes "${{ github.event.inputs.max_minutes || '300' }}" --raw-dir raw
      - run: ./batch-cli compute --label daily
      # J-Quants の応答（全項目）を日付ごとの gzip JSON で R2 に残す。後からの分析用。
      # 指標の計算より後に置き、ここが失敗しても一覧の更新は止めない（CLOUDFLARE_API_TOKEN に R2 の編集権限が要る）
      - name: upload raw data to R2
        run: |
          shopt -s nullglob
          files=(raw/bars/*.json.gz raw/fins/*.json.gz)
          echo "${#files[@]} files to upload"
          [ "${#files[@]}" -eq 0 ] && exit 0
          npm install -g --silent wrangler@4.151.3
          for f in "${files[@]}"; do
            wrangler r2 object put "maaun-stock-insight-raw/jquants/${f#raw/}" --file "$f" --remote >/dev/null
          done
          echo "uploaded ${#files[@]} files"
