name: daily-batch

# 日次バッチ: 銘柄マスタ（JPX）を更新し、J-Quants から株価（終値）と財務（本決算）を取り込んで、指標を D1 に保存する。
# あわせて EDINET から有報・半期報告書（銘柄ごとに最新の1通）の配当政策などの文章を取り、配当方針の手がかりを D1 に、文章を R2 に置く。
# 流れ: build → guard（should-run）→ prepare（migrate・sync-master）→ jquants と edinet を並列に
# 初回だけ過去5年分をまとめて取り込み、2回目以降は前回の続き（毎日なら当日分）だけを取る。
# 起動は Cloudflare の Cron Trigger（平日 18:30 JST）からの workflow_dispatch。schedule は予備で、
# 同日も毎回最新データを再取得する（定期実行は休場日だけ止める）。
# シークレットは gh secret set で登録する（値はここに書かない。docs/06_secrets_and_repository.md）。
on:
  workflow_dispatch:
    inputs:
      force:
        description: "true なら休場日でも動かす"
        default: "false"
      probe:
        description: "true なら D1 に触れず、直近の数日分を J-Quants から取って SQL を成果物に保存する（取得元の確認用）"
        default: "false"
      max_minutes:
        description: "取り込みの時間の上限（分）。過ぎたらそこまでを保存し、次回は続きから"
        default: "300"
      persist_every:
        description: "何日分ごとに D1 へ保存するか。保存のたびに全銘柄の株価の履歴を書き直すので、大きいほど書き込みが少ない"
        default: "1500"
      refill_prices:
        description: "true なら取り込み済みの過去5年分の株価（終値）も取り直して履歴を埋める（財務と進み具合はそのまま。30〜45分ほど）"
        default: "false"
      refill_forecasts:
        description: "true なら取り込み済みの直近1年の決算短信を読み直し、会社予想の配当だけを埋める（財務と進み具合はそのまま。250日分ほどで5〜10分）"
        default: "false"
      refetch_doe:
        description: "true なら EDINET の新しい書類のあと、DOE・配当性向の下限・目標の数字が欠けている保存済みの書類を取り直す（数百通。10〜20分ほど）"
        default: "false"
      refetch_business:
        description: "true なら EDINET の新しい書類のあと、「事業の内容」の文をまだ持っていない保存済みの有報を取り直す（注目テーマの照合用。数千通あるので時間切れまで進め、残りは次回）"
        default: "false"
  schedule:
    # 予備（09:45 UTC = 18:45 JST、平日）。起動済みでも最新データを再取得する
    - cron: "45 9 * * 1-5"

permissions:
  contents: read

concurrency:
  group: daily-batch
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
  EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}

jobs:
  # 一度だけビルドして、後のジョブはバイナリを使い回す
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: batch-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo build -q -p batch-cli --release
      - uses: actions/upload-artifact@v7
        with:
          name: batch-cli
          path: target/release/batch-cli
          retention-days: 1

  # 取得元の確認（D1 には触れない）
  probe:
    needs: build
    if: github.event.inputs.probe == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: batch-cli
      - run: chmod +x batch-cli
      - run: |
          ./batch-cli sync-jq --dry-run probe.sql \
            --from "$(date -u -d '8 days ago' +%F)" --until "$(date -u -d '1 day ago' +%F)"
        env:
          CLOUDFLARE_ACCOUNT_ID: ""
          D1_DATABASE_ID: ""
          CLOUDFLARE_API_TOKEN: ""
      # EDINET は API キーがあるときだけ確認する
      - run: |
          [ -z "$EDINET_API_KEY" ] && { echo "EDINET_API_KEY is not set; skip"; exit 0; }
          ./batch-cli sync-edinet --dry-run probe-edinet.sql --limit 5 \
            --from "$(date -u -d '8 days ago' +%F)" --until "$(date -u -d '1 day ago' +%F)"
        env:
          CLOUDFLARE_ACCOUNT_ID: ""
          D1_DATABASE_ID: ""
          CLOUDFLARE_API_TOKEN: ""
      - uses: actions/upload-artifact@v7
        with:
          name: probe-sql
          path: |
            probe*.sql
            raw/
          retention-days: 3

  guard:
    needs: build
    if: github.event.inputs.probe != 'true'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: batch-cli
      - run: chmod +x batch-cli
      - id: check
        run: ./batch-cli should-run --label daily ${{ (github.event_name == 'workflow_dispatch' || github.event.inputs.force == 'true') && '--force' || '' }}

  # 銘柄マスタまで。J-Quants と EDINET の両方がこれを使う
  prepare:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: batch-cli
      - run: chmod +x batch-cli
      - run: ./batch-cli migrate
      - run: ./batch-cli sync-master

  # J-Quants の株価・財務と指標の計算。EDINET とは並列に動き、互いの失敗に引きずられない
  jquants:
    needs: prepare
    runs-on: ubuntu-latest
    # 初回の5年分は1時間以上。途中で止まっても次回は続きから
    timeout-minutes: 340
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: batch-cli
      - run: chmod +x batch-cli
      # 保存は基本1回（最後）。保存のたびに全銘柄の株価の履歴を書き直すので、回数を増やすと D1 の書き込みが膨らむ
      - run: ./batch-cli sync-jq --rate 60 --max-minutes "${{ github.event.inputs.max_minutes || '300' }}" --persist-every "${{ github.event.inputs.persist_every || '1500' }}" --raw-dir raw ${{ github.event.inputs.refill_prices == 'true' && '--refill-prices' || '' }} ${{ github.event.inputs.refill_forecasts == 'true' && '--refill-forecasts' || '' }}
      - run: ./batch-cli compute --label daily
      - run: ./batch-cli evaluate-recommendations
      # J-Quants の応答（全項目）を日付ごとの gzip JSON で R2 に置く。取り込みが途中で失敗しても、取れた分は置く
      # （CLOUDFLARE_API_TOKEN に R2 の編集権限が要る）
      - name: upload J-Quants raw data to R2
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          files=(raw/bars/*.json.gz raw/fins/*.json.gz)
          echo "${#files[@]} J-Quants files to upload"
          [ ${#files[@]} -eq 0 ] && exit 0
          npm install -g --silent wrangler@4.151.3
          for f in "${files[@]}"; do
            wrangler r2 object put "maaun-stock-insight-raw/jquants/${f#raw/}" --file "$f" --remote >/dev/null
          done
          echo "done"

  # EDINET の有報・半期報告書（銘柄・種類ごとに最新の1通）。J-Quants とは並列に動く。
  # 初回は過去400日分の一覧から（数千通。時間切れなら次回は続きから）。今日の一覧は翌日にもう一度読む
  edinet:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: batch-cli
      - run: chmod +x batch-cli
      - run: ./batch-cli sync-edinet --rate 60 --max-minutes 300 --raw-dir raw ${{ github.event.inputs.refetch_doe == 'true' && '--refetch-doe' || '' }} ${{ github.event.inputs.refetch_business == 'true' && '--refetch-business' || '' }}
      # EDINET の文章を銘柄・種類ごとの gzip JSON で R2 に置く。同じキーに上書きするので古い書類は残らない。
      # 新しい有報で古くなった半期報告書と上場廃止の銘柄は消す。途中で失敗しても、取れた分は置く
      - name: upload EDINET texts to R2
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob globstar
          files=(raw/edinet/**/*.json.gz)
          deletes=()
          [ -f raw/edinet-delete.txt ] && mapfile -t deletes < raw/edinet-delete.txt
          echo "${#files[@]} EDINET files to upload, ${#deletes[@]} to delete"
          [ $(( ${#files[@]} + ${#deletes[@]} )) -eq 0 ] && exit 0
          npm install -g --silent wrangler@4.151.3
          # R2 の一時的なエラー（500）で止まらないよう、1件ずつ3回までやり直す
          for f in "${files[@]}"; do
            for i in 1 2 3; do
              wrangler r2 object put "maaun-stock-insight-raw/${f#raw/}" --file "$f" --remote >/dev/null && break
              [ "$i" -eq 3 ] && exit 1
              sleep $((i * 5))
            done
          done
          for k in "${deletes[@]}"; do
            wrangler r2 object delete "maaun-stock-insight-raw/$k" --remote >/dev/null || echo "not found: $k"
          done
          echo "done"
