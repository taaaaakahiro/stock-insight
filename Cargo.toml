[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/usecase",
  "crates/adapter-batch",
  "crates/batch-cli",
  "crates/adapter-cf",
  "crates/api-worker",
]
# api-worker は wasm32 専用。ネイティブの cargo build / test では対象外にする
default-members = [
  "crates/domain",
  "crates/usecase",
  "crates/adapter-batch",
  "crates/batch-cli",
  "crates/adapter-cf",
]

[workspace.package]
edition = "2021"
version = "0.3.11"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
